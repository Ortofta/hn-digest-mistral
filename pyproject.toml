[project]
name = "hn-digest-worker"
version = "0.1.0"
description = "One-shot Hacker News tech digest workflow: summarize, narrate to MP3, email to iCloud."
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows>=3.10",
    "httpx>=0.28",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
